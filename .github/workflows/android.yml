name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Show annotation-processor classpath
        if: failure()
        run: ./gradlew -q :app:dependencies --configuration kapt | grep -iE "metadata|hilt|room|dagger" || true
      - uses: actions/upload-artifact@v4
        with:
          name: canon-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: canon-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/screenshots.sh apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canon-screenshots
          path: screenshots/
      # Also publish the screenshots to a throwaway branch so they can be viewed
      # without downloading the artifact.
      - name: Push screenshots branch
        if: always()
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
